<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <title>{{PROJECT_NAME}} — Maintenance</title>
    <meta name="theme-color" content="#f5f0e8"/>
    <link rel="icon" type="image/png" href="https://www.gobox.my.id/file/vVUoB.png"/>
    <link rel="apple-touch-icon" href="https://www.gobox.my.id/file/vVUoB.png"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;600;700;800;900&display=swap"/>
    <!-- Firebase SDK — untuk baca waktu mulai maintenance secara real-time -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none; user-select: none;
        }

        :root {
            --primary: #6a3fc8;
            --secondary: #3366d9;
            --bg: #f5f0e8;
            --surface: #fffef9;
            --text: #0a0a0a;
            --text2: #555;
            --border: #0a0a0a;
            --chip: #ffe94d;
            --pink: #ff69b4;
            --lime: #b8ff00;
            --cyan: #00e5ff;
            --orange: #ff6b00;
            --lamp-red: #ff3b30;
            --lamp-violet: #a855f7;
        }

        html, body { width: 100%; height: 100dvh; overflow: hidden; }

        body {
            font-family: "Space Grotesk", system-ui, sans-serif;
            background: var(--bg);
            display: flex; flex-direction: column;
            position: relative;
            /* padding biar ada jarak frame dari tepi layar */
            padding: 10px;
        }

        /* ── ANIMATED DOT GRID (latar belakang) ── */
        body::before {
            content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                radial-gradient(circle, var(--pink) 1px, transparent 1px),
                radial-gradient(circle, var(--cyan) 0.7px, transparent 0.7px);
            background-size: 36px 36px, 18px 18px;
            background-position: 0 0, 9px 9px;
            opacity: .065;
            animation: grid-drift 24s linear infinite;
        }
        @keyframes grid-drift {
            0%   { background-position: 0 0, 9px 9px }
            100% { background-position: 36px 36px, 27px 27px }
        }

        /* ── GARIS CROSSHAIR LATAR ── */
        .bg-lines { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .bg-lines::before { content:""; position:absolute; background:var(--border); opacity:.04; width:1.5px; top:0; bottom:0; left:50%; }
        .bg-lines::after  { content:""; position:absolute; background:var(--border); opacity:.04; height:1.5px; left:0; right:0; top:50%; }

        /* ── PARTICLES ── */
        .pts { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
        .pt  { position: absolute; opacity: 0; animation: pt-rise linear infinite; }
        @keyframes pt-rise {
            0%   { opacity:0; transform:translateY(105vh) rotate(0deg); }
            12%  { opacity:.65; } 88% { opacity:.3; }
            100% { opacity:0; transform:translateY(-8vh) rotate(360deg); }
        }

        /* ════════════════════════════════════════
           PAGE WRAPPER — FRAME PENUH HALAMAN
           Ini pengganti corner bracket lama.
           Border kotak utuh mengelilingi seluruh konten.
        ════════════════════════════════════════ */
        .page-wrapper {
            flex: 1; min-height: 0;
            display: flex; flex-direction: column;
            position: relative; z-index: 5;
            background: var(--bg);
            border: 4px solid var(--border);
            box-shadow:
                0 0 0 2px var(--chip),          /* inner yellow outline */
                inset 0 0 0 2px var(--chip),    /* inner yellow border */
                8px 8px 0 var(--border);        /* hard shadow neobrutalist */
            overflow: hidden;
        }

        /* Titik sudut frame — dekorasi di 4 pojok wrapper */
        .frame-dot {
            position: absolute;
            width: 13px; height: 13px;
            background: var(--chip);
            border: 2.5px solid var(--border);
            z-index: 30; pointer-events: none;
        }
        .fd-tl { top: -6px; left: -6px; }
        .fd-tr { top: -6px; right: -6px; }
        .fd-bl { bottom: -6px; left: -6px; }
        .fd-br { bottom: -6px; right: -6px; }

        /* ══ TOP RAINBOW STRIPE ══ */
        .stripe-top {
            width:100%; height:6px; flex-shrink:0;
            background: linear-gradient(90deg, var(--pink), var(--cyan), var(--lime), var(--primary), var(--orange), var(--pink));
            background-size: 400% 100%;
            animation: stripe-run 3s linear infinite;
        }
        @keyframes stripe-run { 0% { background-position:0% 0 } 100% { background-position:400% 0 } }

        /* ══ PAGE HEADER ══ */
        .page-header {
            width:100%; flex-shrink:0;
            background: var(--chip);
            border-bottom: 3.5px solid var(--border);
            padding: 9px 18px;
            display: flex; align-items: center; justify-content: space-between;
            position: relative; z-index: 10;
        }
        .hdr-brand {
            display: flex; align-items: center; gap: 8px;
            font-family: "Orbitron", sans-serif; font-size: 11px; font-weight: 900;
            letter-spacing: 2.5px; text-transform: uppercase; color: var(--text);
        }
        .hdr-brand-img {
            width: 26px; height: 26px; border-radius: 50%;
            border: 2px solid var(--border); box-shadow: 2px 2px 0 var(--border);
            object-fit: cover; flex-shrink: 0;
        }
        .hdr-status {
            display: flex; align-items: center; gap: 6px;
            background: var(--surface); border: 2.5px solid var(--border);
            box-shadow: 3px 3px 0 var(--border);
            padding: 4px 11px; font-size: 10px; font-weight: 900;
            color: var(--orange); text-transform: uppercase; letter-spacing: 1.5px;
        }
        .status-dot {
            width: 7px; height: 7px; background: var(--orange); border-radius: 50%;
            border: 1.5px solid var(--border);
            animation: dot-pulse 1.4s ease-in-out infinite;
        }
        @keyframes dot-pulse { 0%,100% { transform:scale(1); opacity:1 } 50% { transform:scale(1.65); opacity:.5 } }

        /* ══ MAIN CONTENT ══ */
        .page-main {
            flex: 1; min-height: 0;
            overflow-y: auto; -ms-overflow-style: none; scrollbar-width: none;
            display: flex; align-items: flex-start; justify-content: center;
            padding: 14px 16px;
            position: relative; z-index: 5;
        }
        .page-main::-webkit-scrollbar { display: none; }

        .hero {
            width: 100%; max-width: 460px;
            display: flex; flex-direction: column; align-items: center;
            gap: 11px;
            margin: auto 0;
            animation: hero-in .7s cubic-bezier(.22,1,.36,1) both;
        }
        @keyframes hero-in { from { opacity:0; transform:translateY(22px) scale(.97) } to { opacity:1; transform:none } }

        /* ── ICONS ROW ── */
        .hero-icons {
            display: flex; align-items: center; justify-content: center;
            gap: 18px; width: 100%;
        }

        /* Profile ring */
        .profile-wrap { position: relative; flex-shrink: 0; }
        .profile-ring {
            width: 78px; height: 78px; border-radius: 50%;
            border: 4px solid var(--border); box-shadow: 5px 5px 0 var(--border);
            overflow: hidden;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex; align-items: center; justify-content: center;
            animation: breathe 3.2s ease-in-out infinite;
        }
        @keyframes breathe {
            0%,100% { box-shadow:5px 5px 0 var(--border), 0 0 0 0 rgba(106,63,200,0); }
            50%      { box-shadow:5px 5px 0 var(--border), 0 0 0 8px rgba(106,63,200,.12); }
        }
        .profile-ring img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
        .orbit {
            position:absolute; inset:-10px; border-radius:50%;
            border:2px dashed var(--pink); opacity:.5;
            animation:orbit-spin 7s linear infinite;
        }
        @keyframes orbit-spin { from { transform:rotate(0deg) } to { transform:rotate(360deg) } }
        .badge {
            position:absolute; bottom:0; right:0;
            width:23px; height:23px; border-radius:50%;
            background:var(--orange); border:2.5px solid var(--border);
            display:flex; align-items:center; justify-content:center;
            font-size:8px; color:#fff; box-shadow:2px 2px 0 var(--border);
        }

        .icons-sep { width:2px; height:50px; background:var(--border); opacity:.2; flex-shrink:0; }

        /* ════ DUAL WRENCH BOX ════ */
        .wrench-box {
            position:relative; width:90px; height:90px;
            background:var(--chip);
            border:4px solid var(--border);
            box-shadow:6px 6px 0 var(--border);
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            gap:3px; flex-shrink:0; overflow:visible;
            animation:wrench-rock 2.6s ease-in-out infinite;
        }
        @keyframes wrench-rock { 0%,100%{transform:rotate(0deg)} 20%{transform:rotate(-5deg)} 70%{transform:rotate(5deg)} }
        .wrench-box::before {
            content:"✦"; position:absolute; top:-9px; left:-9px;
            font-size:13px; color:var(--cyan);
            animation:star-blink 2s ease-in-out infinite;
        }
        .wrench-box::after {
            content:"✦"; position:absolute; top:-9px; right:-9px;
            font-size:13px; color:var(--pink);
            animation:star-blink 2s ease-in-out infinite .5s;
        }
        @keyframes star-blink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.2;transform:scale(.55) rotate(180deg)} }

        .dual-wrenches { position:relative; width:58px; height:52px; flex-shrink:0; }
        .dual-wrenches .w1,
        .dual-wrenches .w2 {
            position:absolute; top:50%; left:50%;
            font-size:33px; line-height:1;
            filter:drop-shadow(2px 2px 0px rgba(10,10,10,.65));
        }
        .dual-wrenches .w1 {
            color:var(--primary);
            transform:translate(-50%,-50%) rotate(-45deg);
            animation:w1-tick 2.6s ease-in-out infinite;
        }
        .dual-wrenches .w2 {
            color:var(--orange);
            transform:translate(-50%,-50%) rotate(45deg);
            animation:w2-tick 2.6s ease-in-out infinite;
        }
        @keyframes w1-tick { 0%,100%{transform:translate(-50%,-50%) rotate(-45deg)} 50%{transform:translate(-50%,-50%) rotate(-42deg)} }
        @keyframes w2-tick { 0%,100%{transform:translate(-50%,-50%) rotate(45deg)}  50%{transform:translate(-50%,-50%) rotate(42deg)}  }
        .wrench-lbl { font-size:7px; font-weight:900; text-transform:uppercase; letter-spacing:1.5px; color:var(--text2); }

        /* ── TITLE BLOCK ── */
        .title-block { text-align:center; }
        .brand-micro {
            font-family:"Orbitron",sans-serif; font-size:9px; font-weight:700;
            letter-spacing:5px; text-transform:uppercase; color:var(--primary);
            opacity:.7; margin-bottom:5px;
        }
        .main-title {
            font-family:"Orbitron",sans-serif;
            font-size:clamp(20px,5.5vw,32px); font-weight:900;
            text-transform:uppercase; letter-spacing:-1px;
            display:flex; align-items:center; justify-content:center; gap:8px;
        }
        .title-badge {
            display:inline-block; background:var(--primary); color:#fff;
            padding:3px 14px; border:3px solid var(--border);
            box-shadow:4px 4px 0 var(--border);
        }
        .sub-title {
            font-size:10px; font-weight:700; color:var(--text2);
            text-transform:uppercase; letter-spacing:3px;
            margin-top:5px; opacity:.6;
        }

        /* ── DESCRIPTION BOX ── */
        .desc-box {
            width:100%; background:var(--bg);
            border:3px solid var(--border);
            box-shadow:5px 5px 0 var(--border);
            padding:11px 16px; position:relative;
        }
        .desc-box::before {
            content:"★  ✦  ★"; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
            font-size:8px; background:var(--chip); padding:0 10px;
            border:1.5px solid var(--border); letter-spacing:6px; color:var(--text);
        }
        .desc-text { font-size:12.5px; font-weight:600; color:var(--text); line-height:1.6; text-align:center; }
        .desc-text b { color:var(--primary); }

        /* ── BENTO GRID ── */
        .bento {
            width:100%; display:grid;
            grid-template-columns:auto 1fr;
            grid-template-rows:auto auto;
            gap:8px;
        }
        .bento-cell {
            background:var(--surface);
            border:3px solid var(--border);
            box-shadow:4px 4px 0 var(--border);
            padding:9px 12px;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:2px;
        }
        .bento-full { grid-column:1 / -1; align-items:stretch; }

        .cell-icon { font-size:15px; color:var(--primary); }
        .cell-lbl { font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:1.5px; color:var(--text2); }
        .cell-val  { font-family:"Orbitron",sans-serif; font-size:14px; font-weight:700; color:var(--text); }

        .cd-lbl { font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:1.5px; color:var(--text2); margin-bottom:4px; }
        .cd-nums { display:flex; align-items:center; gap:3px; }
        .cd-n {
            font-family:"Orbitron",sans-serif; font-size:17px; font-weight:900;
            color:#fff; background:var(--primary);
            border:2.5px solid var(--border); box-shadow:3px 3px 0 var(--border);
            min-width:35px; text-align:center; padding:3px 2px; line-height:1.2;
            transition:transform .13s;
        }
        .cd-n.flip { transform:scaleY(.84); }
        .cd-sep {
            font-family:"Orbitron",sans-serif; font-size:15px; font-weight:900; color:var(--primary);
            animation:sep-blink 1s step-end infinite;
        }
        @keyframes sep-blink { 0%,100%{opacity:1} 50%{opacity:0} }

        .progress-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
        .progress-lbl { font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:1.5px; color:var(--text2); }
        .progress-pct { font-family:"Orbitron",sans-serif; font-size:12px; font-weight:700; color:var(--primary); }
        .progress-track {
            width:100%; height:15px; background:var(--bg);
            border:3px solid var(--border); box-shadow:3px 3px 0 var(--border);
            overflow:hidden; position:relative;
        }
        .progress-fill {
            height:100%; width:72%;
            background:linear-gradient(90deg,var(--primary),var(--cyan),var(--pink));
            background-size:200% 100%;
            animation:pfill-shift 2s linear infinite, pfill-enter 2.2s cubic-bezier(.22,1,.36,1) both;
            position:relative;
        }
        @keyframes pfill-shift { 0%{background-position:0% 0} 100%{background-position:200% 0} }
        @keyframes pfill-enter { from{width:0%} to{width:72%} }
        .progress-fill::after {
            content:""; position:absolute; top:0; right:0; width:3px; height:100%;
            background:#fff; opacity:.7; animation:caret-blink .8s ease-in-out infinite;
        }
        @keyframes caret-blink { 0%,100%{opacity:.7} 50%{opacity:.1} }

        /* ── LOG ROW ── */
        .log-row { display:flex; gap:7px; width:100%; }
        .log-item {
            flex:1; display:flex; align-items:center; gap:6px;
            background:var(--surface); border:2.5px solid var(--border);
            box-shadow:3px 3px 0 var(--border);
            padding:7px 9px; font-size:10px; font-weight:700; color:var(--text);
        }
        .log-item i    { font-size:10px; flex-shrink:0; }
        .log-item.done i { color:#10b981; }
        .log-item.wip  i { color:var(--orange); }
        .log-item.todo i { color:#bbb; }
        .log-item span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

        /* ── ACTIONS ── */
        .actions-row { display:flex; gap:8px; width:100%; }
        .notify-btn {
            flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
            background:var(--primary); color:#fff;
            border:3px solid var(--border); box-shadow:5px 5px 0 var(--border);
            padding:11px 8px;
            font-family:"Space Grotesk",sans-serif; font-size:11.5px; font-weight:900;
            text-transform:uppercase; letter-spacing:1px; cursor:pointer;
            transition:transform .15s, box-shadow .15s;
            position:relative; overflow:hidden;
        }
        .notify-btn::before {
            content:""; position:absolute; top:0; left:-100%; width:100%; height:100%;
            background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
            animation:btn-shine 2.8s ease-in-out infinite;
        }
        @keyframes btn-shine { 0%{left:-100%} 55%,100%{left:110%} }
        .notify-btn:active { transform:translate(4px,4px); box-shadow:1px 1px 0 var(--border); }

        .social-btns { display:flex; gap:6px; flex-shrink:0; }
        .soc-btn {
            width:42px; height:100%; min-height:42px;
            background:var(--surface); border:2.5px solid var(--border);
            box-shadow:3px 3px 0 var(--border);
            display:flex; align-items:center; justify-content:center;
            font-size:16px; cursor:pointer; text-decoration:none;
            transition:transform .15s, box-shadow .15s, background .15s;
        }
        .soc-btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--border); background:var(--chip); }

        /* ══ PAGE FOOTER ══ */
        .page-footer { width:100%; flex-shrink:0; }
        .footer-bar {
            background:var(--chip); border-top:3px solid var(--border);
            padding:6px 18px;
            display:flex; align-items:center; justify-content:center;
        }
        .footer-text {
            font-size:8.5px; font-weight:700; color:var(--text);
            text-transform:uppercase; letter-spacing:2px; opacity:.5;
        }
        .stripe-bot {
            width:100%; height:5px;
            background:linear-gradient(90deg,var(--lime),var(--pink),var(--cyan),var(--orange),var(--lime));
            background-size:400% 100%;
            animation:stripe-run 4s linear infinite reverse;
        }

        /* ══ TOAST ══ */
        .toast {
            position:fixed; bottom:22px; left:50%;
            transform:translateX(-50%) translateY(60px);
            background:var(--text); color:var(--surface);
            padding:10px 22px; border:2.5px solid var(--border);
            box-shadow:5px 5px 0 var(--border);
            font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:1px;
            z-index:9999; opacity:0;
            transition:opacity .3s, transform .3s;
            white-space:nowrap; pointer-events:none;
        }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

        /* ═══════════════════════════════════════════════════════════
           HIASAN LAMPU KOTAK NEOBRUTALISM (ringan)
           Cincin outline warna-warni yang pelan-pelan gonta-ganti
           warna — cuma outline-color, bukan mask/filter, biar ringan.
           ═══════════════════════════════════════════════════════════ */
        @keyframes lampuPendar {
            0%   { outline-color: var(--lamp-red); }
            20%  { outline-color: var(--orange); }
            40%  { outline-color: var(--lime); }
            60%  { outline-color: var(--cyan); }
            80%  { outline-color: var(--lamp-violet); }
            100% { outline-color: var(--pink); }
        }

        .page-wrapper, .hdr-brand-img, .hdr-status, .profile-ring, .badge,
        .wrench-box, .title-badge, .desc-box, .bento-cell, .cd-n,
        .progress-track, .log-item, .notify-btn, .soc-btn, .toast {
            outline: 2px solid var(--lamp-red);
            outline-offset: 2px;
        }
        .page-wrapper, .hdr-brand-img, .hdr-status, .badge,
        .title-badge, .desc-box, .bento-cell, .cd-n,
        .progress-track, .log-item, .notify-btn, .soc-btn, .toast {
            animation: lampuPendar 6s ease-in-out infinite;
        }
        .hdr-brand-img:nth-child(even), .badge:nth-child(even), .title-badge:nth-child(even),
        .bento-cell:nth-child(even), .cd-n:nth-child(even), .log-item:nth-child(even),
        .notify-btn:nth-child(even), .soc-btn:nth-child(even) {
            animation-delay: -3s;
        }
        /* Elemen yang sudah punya animasi sendiri — digabung, bukan ditimpa */
        .profile-ring { animation: breathe 3.2s ease-in-out infinite, lampuPendar 6s ease-in-out infinite; }
        .wrench-box    { animation: wrench-rock 2.6s ease-in-out infinite, lampuPendar 6s ease-in-out infinite; }

        @media (prefers-reduced-motion: reduce) {
            .page-wrapper, .hdr-brand-img, .hdr-status, .profile-ring, .badge,
            .wrench-box, .title-badge, .desc-box, .bento-cell, .cd-n,
            .progress-track, .log-item, .notify-btn, .soc-btn, .toast {
                animation: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Latar belakang -->
    <div class="bg-lines"></div>
    <div class="pts" id="pts"></div>

    <!-- Toast notifikasi -->
    <div class="toast" id="toast">✓ Membuka WhatsApp...</div>

    <!-- ════════════════════════════════════════
         PAGE WRAPPER — frame border penuh halaman
         (corner bracket lama sudah dihapus,
          diganti border kotak utuh di sini)
    ════════════════════════════════════════ -->
    <div class="page-wrapper">

        <!-- Titik dekorasi di 4 pojok frame -->
        <div class="frame-dot fd-tl"></div>
        <div class="frame-dot fd-tr"></div>
        <div class="frame-dot fd-bl"></div>
        <div class="frame-dot fd-br"></div>

        <!-- ══ TOP STRIPE ══ -->
        <div class="stripe-top"></div>

        <!-- ══ HEADER ══ -->
        <header class="page-header">
            <div class="hdr-brand">
                <img class="hdr-brand-img" src="https://www.gobox.my.id/file/vVUoB.png" alt="{{PROJECT_NAME}}"
                     onerror="this.style.display='none'"/>
                ✦ {{PROJECT_NAME}} ✦
            </div>
            <div class="hdr-status">
                <div class="status-dot"></div>
                Maintenance
            </div>
        </header>

        <!-- ══ KONTEN UTAMA ══ -->
        <main class="page-main">
            <div class="hero">

                <!-- Profile + Dual Wrenches -->
                <div class="hero-icons">
                    <div class="profile-wrap">
                        <div class="profile-ring">
                            <img src="https://www.gobox.my.id/file/vVUoB.png" alt="{{PROJECT_NAME}}"
                                 onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\'fas fa-code\' style=\'font-size:30px;color:#fff;\'></i>'"/>
                        </div>
                        <div class="orbit"></div>
                        <div class="badge"><i class="fas fa-star" style="font-size:7px;"></i></div>
                    </div>

                    <div class="icons-sep"></div>

                    <!-- DUAL KUNCI INGGRIS SILANG -->
                    <div class="wrench-box">
                        <div class="dual-wrenches">
                            <i class="fas fa-wrench w1"></i>
                            <i class="fas fa-wrench w2"></i>
                        </div>
                        <span class="wrench-lbl">Under Fix</span>
                    </div>
                </div>

                <!-- Title -->
                <div class="title-block">
                    <div class="brand-micro">&#x2726; {{PROJECT_NAME}} &#x2726;</div>
                    <div class="main-title"><span class="title-badge">Maintenance</span></div>
                    <div class="sub-title">Sedang Dalam Perbaikan</div>
                </div>

                <!-- Deskripsi -->
                <div class="desc-box">
                    <p class="desc-text">{{PROJECT_DESC}}</p>
                </div>

                <!-- Bento: Jam + Countdown + Progress -->
                <div class="bento">
                    <div class="bento-cell">
                        <i class="fas fa-clock cell-icon"></i>
                        <div class="cell-lbl">Waktu</div>
                        <div class="cell-val" id="liveTime">--:--:--</div>
                    </div>
                    <div class="bento-cell">
                        <div class="cd-lbl">&#x23F1; Estimasi Selesai</div>
                        <div class="cd-nums">
                            <div class="cd-n" id="cdH">00</div>
                            <div class="cd-sep">:</div>
                            <div class="cd-n" id="cdM">00</div>
                            <div class="cd-sep">:</div>
                            <div class="cd-n" id="cdS">00</div>
                        </div>
                    </div>
                    <div class="bento-cell bento-full">
                        <div class="progress-top">
                            <span class="progress-lbl">Progress Perbaikan</span>
                            <span class="progress-pct">72%</span>
                        </div>
                        <div class="progress-track">
                            <div class="progress-fill"></div>
                        </div>
                    </div>
                </div>

                <!-- Log -->
                <div class="log-row">
                    <div class="log-item done"><i class="fas fa-check-circle"></i><span>Backup DB</span></div>
                    <div class="log-item wip"><i class="fas fa-spinner fa-spin"></i><span>Update UI</span></div>
                    <div class="log-item todo"><i class="fas fa-circle"></i><span>Testing</span></div>
                </div>

                <!-- Aksi -->
                <div class="actions-row">
                    <button class="notify-btn" onclick="triggerNotify()">
                        <i class="fas fa-bell"></i> Beritahu Saya
                    </button>
                    <div class="social-btns">
                        <a class="soc-btn" href="https://wa.link/81ru8e" target="_blank" title="WhatsApp">
                            <i class="fab fa-whatsapp" style="color:#25D366;"></i>
                        </a>
                        <a class="soc-btn" href="#" title="Refresh" onclick="location.reload();return false;">
                            <i class="fas fa-redo" style="color:var(--primary);"></i>
                        </a>
                    </div>
                </div>

            </div>
        </main>

        <!-- ══ FOOTER ══ -->
        <footer class="page-footer">
            <div class="footer-bar">
                <span class="footer-text">© {{PROJECT_NAME}} — All Rights Reserved</span>
            </div>
            <div class="stripe-bot"></div>
        </footer>

    </div><!-- end .page-wrapper -->

    <script>
        // Block right-click & devtools
        document.addEventListener("contextmenu", e => e.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode === 123) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode === "I".charCodeAt(0)) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode === "J".charCodeAt(0)) return false;
            if(e.ctrlKey && e.keyCode === "U".charCodeAt(0)) return false;
        };

        // Live clock
        function tick() {
            const n = new Date();
            const v = document.getElementById("liveTime");
            if(v) v.textContent = [n.getHours(), n.getMinutes(), n.getSeconds()]
                .map(x => String(x).padStart(2,"0")).join(":");
        }
        tick(); setInterval(tick, 1000);

        // ─── COUNTDOWN REAL-TIME via Firebase ────────────────────────────────
        // Waktu mulai (startedAt) diambil otomatis dari Firebase saat admin
        // mengaktifkan maintenance di admin.html — tidak perlu diisi manual.
        // Durasi maintenance tetap 24 jam dari waktu aktivasi.
        // ─────────────────────────────────────────────────────────────────────
        const cdH = document.getElementById("cdH"),
              cdM = document.getElementById("cdM"),
              cdS = document.getElementById("cdS");
        let _cdInt = null;
        /* durationMs dibaca dari Firebase — default 24 jam jika tidak ada */
        const DEFAULT_DURATION_MS = 24 * 3600 * 1000;

        function startCountdown(startedAt, durationMs) {
            if (_cdInt) clearInterval(_cdInt);
            // Unlimited (sentinel = 0) — tampilkan simbol tak terbatas
            if (durationMs === 0) {
                if (cdH) { cdH.classList.remove("flip"); cdH.textContent = "\u221e"; }
                if (cdM) { cdM.classList.remove("flip"); cdM.textContent = "\u221e"; }
                if (cdS) { cdS.classList.remove("flip"); cdS.textContent = "\u221e"; }
                return;
            }
            const _dur = (durationMs && durationMs > 0) ? durationMs : DEFAULT_DURATION_MS;
            const TARGET = startedAt + _dur;
            function tickCd() {
                const diff = Math.max(0, TARGET - Date.now());
                const h = Math.floor(diff / 3600000),
                      m = Math.floor(diff % 3600000 / 60000),
                      s = Math.floor(diff % 60000 / 1000);
                const ns = String(s).padStart(2, "0");
                if (cdS && cdS.textContent !== ns) {
                    cdS.classList.add("flip");
                    setTimeout(() => cdS.classList.remove("flip"), 130);
                }
                if (cdH) cdH.textContent = String(h).padStart(2, "0");
                if (cdM) cdM.textContent = String(m).padStart(2, "0");
                if (cdS) cdS.textContent = ns;
                if (!diff) clearInterval(_cdInt);
            }
            tickCd();
            _cdInt = setInterval(tickCd, 1000);
        }

        // ─── PROGRESS BAR REAL-TIME via Firebase ─────────────────────────────
        // Nilai persen diatur admin lewat slider di admin.html. Keyframe entrance
        // animation-nya di-override dinamis (bukan cuma width statis) supaya
        // animasi masuknya tetap mengarah ke persen yang benar.
        // ─────────────────────────────────────────────────────────────────────
        const DEFAULT_PROGRESS = 72;
        function updateProgressBar(pct) {
            pct = Math.max(0, Math.min(100, parseInt(pct)));
            if (isNaN(pct)) pct = DEFAULT_PROGRESS;
            const pctEl = document.querySelector(".progress-pct");
            if (pctEl) pctEl.textContent = pct + "%";
            let styleEl = document.getElementById("dynProgressStyle");
            if (!styleEl) {
                styleEl = document.createElement("style");
                styleEl.id = "dynProgressStyle";
                document.head.appendChild(styleEl);
            }
            styleEl.textContent =
                ".progress-fill{width:" + pct + "%;}" +
                "@keyframes pfill-enter{from{width:0%}to{width:" + pct + "%;}}";
        }

        // Init Firebase & dengarkan waktu mulai maintenance secara real-time
        (function() {
            try {
                var _fbCfg = {
                    apiKey:            "AIzaSyDbe8tKXpzRwPfYCmh9ycYJKBsVnlV7qU8",
                    authDomain:        "hidzproject-8f335.firebaseapp.com",
                    databaseURL:       "https://hidzproject-8f335-default-rtdb.asia-southeast1.firebasedatabase.app",
                    projectId:         "hidzproject-8f335",
                    storageBucket:     "hidzproject-8f335.firebasestorage.app",
                    messagingSenderId: "541350396047",
                    appId:             "1:541350396047:web:63cb065c77a682dc5730fa"
                };
                if (!firebase.apps.length) firebase.initializeApp(_fbCfg);
                // Id project ini — diisi otomatis oleh admin.html saat generate
                // halaman ini, HARUS sama persis dengan yang terdaftar di
                // hidz_projects supaya baca node yang benar.
                var _projectId = "{{PROJECT_ID}}";
                // Real-time listener: countdown restart otomatis jika admin aktifkan ulang
                firebase.database().ref('hidz_projects/' + _projectId + '/maintenance').on('value', function(snap) {
                    var val = snap.val();
                    var startedAt  = (val && val.startedAt)  ? val.startedAt  : Date.now();
                    // typeof check agar nilai 0 (unlimited) tidak dianggap falsy
                    var durationMs = (val && typeof val.durationMs === 'number') ? val.durationMs : DEFAULT_DURATION_MS;
                    startCountdown(startedAt, durationMs);
                    updateProgressBar(val && typeof val.progress === 'number' ? val.progress : DEFAULT_PROGRESS);
                });
            } catch(e) {
                // Fallback jika Firebase tidak tersedia — countdown dari sekarang
                startCountdown(Date.now(), DEFAULT_DURATION_MS);
            }
        })();
        // ──────────────────────────────────────────────────────────────────────

        // Notify — buka WA kontak admin, biar user bisa langsung tanya kapan online lagi
        function triggerNotify() {
            const t = document.getElementById("toast");
            t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 2800);
            window.open("https://wa.link/81ru8e", "_blank");
        }

        // Particles
        (function() {
            const c = document.getElementById("pts");
            const syms = ["✦","★","✱","◆","✧","⟡","✿","⚙"];
            const cols = ["#6a3fc8","#ff69b4","#00e5ff","#b8ff00","#ff6b00"];
            for(let i = 0; i < 20; i++) {
                const el = document.createElement("span");
                el.className = "pt";
                el.textContent = syms[i % syms.length];
                el.style.cssText = `left:${Math.random()*100}vw;font-size:${9+Math.random()*10}px;color:${cols[i%5]};animation-duration:${9+Math.random()*10}s;animation-delay:${Math.random()*15}s;`;
                c.appendChild(el);
            }
        })();
    </script>
</body>
</html>
